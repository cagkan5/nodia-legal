/* ════════════════════════════════════════════════════════════════════════
   NODIA COLLECTIVE — kök sayfa.  (LANDING-2 · 2 Eyl 2026)

   ⛔ BU SAYFA HUKUK METİNLERİNDEN AYRIDIR. `kullanim-sartlari/` rıza hash'i
      ailesindendir, `cocuk-guvenligi/` ise uygulamadaki güvenlik satırıyla
      kelimesi kelimesine bağlıdır — ikisine de bu dosyadan DOKUNULMAZ.

   ⛔ SAYFA HİÇBİR ŞEY ANLATMAZ. Bölüm yok, kaydırma yok, pazarlama metni
      yok, slogan yok. Görünen metin: marka adı, düğme ve dipteki şerit.
      Sayfa kapıyı TARİF ETMEZ, kapının KENDİSİ olur.

   ⛔ ŞEHİR ADI GEÇMEZ. Nodia bir şehirle sınırlı değildir. (Hukuk
      sayfalarındaki "Bursa" veri sorumlusunun POSTA ADRESİDİR.)

   ⛔ WEB SİTESİNDEN BAŞVURU YOK. Düğme bir forma değil, uygulamanın MAĞAZA
      adımına götürür. "İletişim" de bir sayfaya değil, doğrudan `mailto:`ye.

   ⭑ ZEMİN DEĞERLERİ UYDURULMADI — `brand/store/kaynak/B2-feature-graphic.svg`
      dosyasından, yani Play'de YAYINDA olan öne çıkan görselin kaynağından
      okundu: nokta dokusu BRONZ `#B36A3C` (altın değil), 26 px ızgara;
      halkalar ÜÇ tane, yarıçap oranı 200:300:400, altın `#C6A35A`, 1.5 px;
      kelime markası İKİ EŞİT satır, `#E7D4A6`.

   ⭑ İMZA ÖĞESİ — 3B YÖRÜNGE SİSTEMİ, MÜHRÜN ÇEVRESİNDE.
      ⛔ SİSTEM MÜHRE BAĞLIDIR, pencereye değil (`.zemin`, `.muhur`in
         merkezinde sıfır boyutlu bir çıpadır). Pencereye bağlıyken mühür
         kompozisyonun ÜSTÜNDE kaldığı için yörüngelerin merkezinde
         DURMUYORDU — Çağkan gördü, düzeltildi.
      ⭑ İKİ AYRI DÖNÜŞ, ve ikisi de gerekli:
        (1) `nd-donus` — noktalar yörünge üzerinde yürür (16/22/34 sn).
        (2) `nd-savrulma` — DÜZLEMİN KENDİSİ savrulur (78/104/140 sn, ortadaki
            ters yönde). ⛔ Bu olmadan elips SABİT görünür: `rotateY` bir
            çemberi kendi üstüne eşler, yani yörünge çizgisi hiç kıpırdamaz,
            yalnız noktalar yürür. İlk 3B denemesinde tam bu oldu.
      ⭑ Adet yarıçapla ORANTILI (6 / 9 / 12) ⇒ noktalar arası YAY aralığı üç
        yörüngede de aynı; sayı keyfi değil, geometriden.
      ⭑ ÜÇ DERİNLİK İPUCU: perspektif (öne gelen BÜYÜR), `nd-derinlik`
        (arkadaki SÖNER — faz kayması `--f` her noktanın kendi açısından
        türetildi), ve yatık yörünge çizgisinin elips görünmesi.
      ⛔ NOKTALAR KAMERAYA DÖNÜK TUTULUR (`nd-karsi`); serbest bırakılsalar
         yatık düzlemde ince elipslere EZİLİRLERDİ. Karşı-dönüş yörüngenin
         dönüşüyle AYNI sürededir ve ikisi de gecikmesiz başlar ⇒ faz kilidi
         kendiliğinden korunur.
      ⛔ Karşı-dönüş savrulmayı TELAFİ ETMEZ ve etmesine GEREK YOK: artakalan
         fark saf bir Z ekseni dönüşüdür, YUVARLAK bir noktada görünmez.
      ⛔ ELENDİ: "kenarı bronz yaya boyanmış halka + tek nokta" — yavaş olsa
         da SPINNER görsel diline oturuyordu. Klişe hızda değil BİÇİMDE olur.

   ⭑ HAREKET SAF CSS — kütüphane yok. Önceden belirli hareket ana iş
      parçacığının dışında koşar. ⛔ Yalnız `transform`, `scale`, `opacity`.
      ⛔ Bir noktanın ÜÇ animasyonu ÜÇ AYRI ÖZELLİKTEDİR (karşı-dönüş →
         `transform`, nabız → `scale`, derinlik → `opacity`); tek özelliğe
         yığılsalar birbirlerini ezerlerdi. Aynı sebeple savrulma ve dönüş
         AYRI KATMANLARDA (`.yorunge` / `.donus`).

   ⭑ FONTLAR KENDİ SUNUCUMUZDA, CDN'DEN DEĞİL — Google Fonts her ziyaretçinin
      IP'sini üçüncü tarafa gönderirdi ve Gizlilik Politikası web sitesi için
      böyle bir aktarım BEYAN ETMİYOR. Lisans: varliklar/FONT-LISANSLARI.txt.
      ⭑ DÜĞME JOST 600 — kelime markasından AYRI bir ses (ad tören, düğme
        iş). Gerçek 600 yüzü bu iş için üretildi: değişken Jost'tan 600'de
        sabitlenip yalnız Türkçe BÜYÜK harf kümesine altkümelendi (31 glif,
        2.168 bayt). ⛔ Sentetik kalın YASAK — düğme bir ara Cinzel'di, ondan
        önce de Jost 400 yüzüyle `font-weight:500` istiyordu ve tarayıcı
        sahte kalın üretiyordu. [ÖLÇÜM: subset'ler Ş/ş/İ dahil gereken tüm
        glifleri taşıyor.]

   ⭑ TEK ŞERİT, SAYFANIN DİBİNDE — üst nav YOK (Çağkan: "iletişim de aşağıda
      olsun"; sayfa tek ekran, aşağı yukarı inmek yok). Dört öğe: İletişim ·
      Kullanım Şartları · Gizlilik Politikası · telif.
      Kaldırılan bağlantıların erişilebilirliği ÖLÇÜLDÜ:
      `cocuk-guvenligi` BEŞ hukuk sayfasından, `aydinlatma` yine beşinden,
      `hesap-silme` ise `aydinlatma`'dan linkli ⇒ üçü de ayakta. Sayfalar
      SİLİNMEDİ.

   ⭑ DAİMA KOYU — markanın ilk izlenimi ziyaretçinin telefon ayarına
      devredilmez. (Hukuk sayfaları iki temayı da destekler.)
   ════════════════════════════════════════════════════════════════════════ */

@font-face{font-family:"Cinzel";src:url("varliklar/cinzel-500.woff2") format("woff2");
  font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Jost";src:url("varliklar/jost-400.woff2") format("woff2");
  font-weight:400;font-style:normal;font-display:swap}
/* ⭑ GERÇEK 600 — düğme için. Değişken Jost'tan 600'de sabitlenip yalnız
   Türkçe BÜYÜK harf kümesine altkümelendi: 31 glif, 2.168 bayt.
   ⛔ Sentetik kalın kullanılmaz: yüklü tek yüz 400 iken `font-weight:600`
      istemek tarayıcıya sahte kalın ürettirir — düğmenin önceki hâlinde
      tam bu oluyordu. */
@font-face{font-family:"Jost";src:url("varliklar/jost-600.woff2") format("woff2");
  font-weight:600;font-style:normal;font-display:swap}

:root{
  --gece:#1E1913;
  --altin:#C6A35A;
  --altin-acik:#E7D4A6;
  --bronz:#B36A3C;
  --kum:#E5D8C0;
  --sessiz:#9A9285;

  --cikis:cubic-bezier(0.23,1,0.32,1);   /* güçlü ease-out (giriş) */
  --nefes:cubic-bezier(0.37,0,0.63,1);   /* easeInOutSine (ambiyans) */

  /* Orta yörüngenin yarıçapı; diğer ikisi 200:300:400 oranından. */
  --r:min(40vw,272px);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  position:relative;
  min-height:100svh;
  display:flex;
  /* Sütun yönü: iki şerit normalde akış DIŞINDA ⇒ akışta yalnız `main` var
     ve tam ortalanır. Kısa pencerede ikisi de akışa döner ve alt alta
     dizilir — satır yönünde olsalardı `main`in YANINA geçerlerdi. */
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:clamp(2rem,8vw,4rem) 1.25rem;
  background-color:var(--gece);
  color:var(--kum);
  font-family:"Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:1.0625rem;
  line-height:1.7;
  text-align:center;
  overflow-x:hidden;
  background-image:
    radial-gradient(circle at 50% 44%,
      rgba(198,163,90,.13) 0%,
      rgba(179,106,60,.06) 38%,
      rgba(30,25,19,0) 72%),
    radial-gradient(rgba(179,106,60,.14) 1.3px,transparent 1.3px);
  background-size:100% 100%,26px 26px;
  background-position:center,center;
}

/* ── 3B yörünge sistemi ────────────────────────────────────────────────── */
/* ⛔ Sıfır boyutlu çıpa, `.muhur`in TAM MERKEZİNDE ⇒ mühür yörüngelerin
   ortasında durur. Boyutsuz olduğu için yerleşimi hiç etkilemez. */
.zemin{
  position:absolute;top:50%;left:50%;
  width:0;height:0;
  pointer-events:none;
  perspective:1050px;
}
/* Dış katman: düzlemin SAVRULMASI (yörüngenin kendisi döner). */
.yorunge{
  position:absolute;top:0;left:0;
  width:var(--w);aspect-ratio:1;
  margin:calc(var(--w) / -2) 0 0 calc(var(--w) / -2);
  transform-style:preserve-3d;
  animation:nd-savrulma var(--sv) linear infinite;
}
.yr-ic  {--rr:calc(var(--r) * 2/3);--w:calc(var(--r) * 4/3);--egim:36deg;--z:-12deg;--sp:16s;--sv:78s; --iz:rgba(198,163,90,.20)}
.yr-orta{--rr:var(--r);            --w:calc(var(--r) * 2);  --egim:27deg;--z:7deg;  --sp:22s;--sv:104s;--iz:rgba(198,163,90,.13)}
.yr-dis {--rr:calc(var(--r) * 4/3);--w:calc(var(--r) * 8/3);--egim:44deg;--z:-3deg; --sp:34s;--sv:140s;--iz:rgba(198,163,90,.08)}
/* Orta yörünge ters savrulur — sistem tek yöne akan bir çark gibi durmasın. */
.yr-orta{animation-direction:reverse}

@keyframes nd-savrulma{
  from{transform:rotateZ(var(--z))}
  to  {transform:rotateZ(calc(var(--z) + 360deg))}
}

/* İç katman: noktaların yörünge üzerinde YÜRÜMESİ. */
.donus{
  position:absolute;inset:0;
  transform-style:preserve-3d;
  animation:nd-donus var(--sp) linear infinite;
}
@keyframes nd-donus{
  from{transform:rotateX(var(--egim)) rotateY(0deg)}
  to  {transform:rotateX(var(--egim)) rotateY(360deg)}
}

/* Yörünge çizgisi: `rotateX(90deg)` ile noktaların düzlemine YATIRILIR. */
.iz{
  position:absolute;inset:0;border-radius:50%;
  border:1.5px solid var(--iz);
  transform:rotateX(90deg);
}

/* `<i>` yalnız 3B KONUM taşır (boyutsuz), `<b>` görünen daireyi taşır. */
.donus i{
  position:absolute;top:50%;left:50%;width:0;height:0;
  transform-style:preserve-3d;
  transform:rotateY(var(--a)) translateZ(var(--rr));
}
.donus b{
  position:absolute;top:0;left:0;
  width:var(--b);height:var(--b);
  margin:calc(var(--b) / -2) 0 0 calc(var(--b) / -2);
  border-radius:50%;
  background:var(--bronz);
  opacity:var(--o);
  /* Işıma noktanın kendi boyuna oranlı ⇒ perspektif noktayı büyütünce
     halesi de büyür. Durağan; kare başına boyama maliyeti yok. */
  box-shadow:0 0 calc(var(--b) * 1.5) calc(var(--b) * .12) rgba(179,106,60,.55);
  animation:
    nd-karsi     var(--sp) linear       infinite,
    nd-nabiz     var(--s)  var(--nefes) var(--d) infinite,
    nd-derinlik  var(--sp) var(--nefes) calc(var(--sp) * var(--f) * -1) infinite;
}
/* Ebeveynin dönüşünün TERSİ ⇒ nokta hep kameraya bakar, ezilmez.
   ⛔ Savrulma terimi YOK ve gerekmiyor: artakalan fark saf Z dönüşüdür,
      yuvarlak bir noktada görünmez. */
@keyframes nd-karsi{
  from{transform:rotateY(calc(var(--a) * -1))          rotateX(calc(var(--egim) * -1))}
  to  {transform:rotateY(calc(var(--a) * -1 - 360deg)) rotateX(calc(var(--egim) * -1))}
}
/* `scale(0)` YOK — hiçbir şey yoktan belirmez. */
@keyframes nd-nabiz{
  0%,100%{scale:.78}
  50%    {scale:1.22}
}
/* Arkadaki nokta söner; öndeki tam parlaklıkta. */
@keyframes nd-derinlik{
  0%,100%{opacity:var(--o)}
  50%    {opacity:calc(var(--o) * .18)}
}

/* ⭑ Kompozisyon pencerenin ORTASINDAN YUKARI çekilir (Çağkan: "daha
   yukarıdan başlayabilir"). Sütun yönünde ortalanan tek akış öğesine alt
   boşluk vermek, öğeyi o boşluğun YARISI kadar yukarı taşır. */
main{position:relative;max-width:34rem;width:100%;margin-bottom:clamp(5rem,17vh,12rem)}

/* ── Mühür ─────────────────────────────────────────────────────────────── */
.muhur{
  position:relative;
  display:grid;place-items:center;
  margin:0 auto clamp(1.6rem,4.5vw,2.2rem);
}
.muhur img{
  display:block;
  width:clamp(108px,27vw,152px);height:auto;
  position:relative;z-index:1;
}
/* Nefes — mührün KENDİSİ değil, arkasındaki parıltı nefes alır. (K9'un
   değerleri: opaklık .45↔.9 · ölçek 1↔1.06 · 7 sn.) */
.muhur::before{
  content:"";position:absolute;
  width:clamp(154px,39vw,220px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(198,163,90,.22) 0%,rgba(198,163,90,0) 68%);
  animation:nd-nefes 7s var(--nefes) infinite;
  z-index:1;
}
@keyframes nd-nefes{
  0%,100%{opacity:.45;transform:scale(1)}
  50%    {opacity:.90;transform:scale(1.06)}
}

/* ── Kelime markası ────────────────────────────────────────────────────── */
/* ⚠️ TÜRKÇE İ TUZAĞI — `text-transform:uppercase` KULLANILMAZ. Sayfa
   `lang="tr"` olduğu için tarayıcı "Nodia" → "NODİA" üretir (noktalı İ).
   Büyük harfler DOĞRUDAN yazılmıştır — düğmedeki "BAŞVUR" da öyle.
   ⛔ İki satır EŞİT puntoda — kaynaktaki kelime markası böyledir. */
h1{
  margin:0;
  font-family:"Cinzel",Georgia,"Times New Roman",serif;
  font-weight:500;
  font-size:clamp(1.35rem,5.6vw,2rem);
  line-height:1.45;
  letter-spacing:.3em;
  text-indent:.3em; /* sondaki harf boşluğunu geri al — optik ortalama */
  color:var(--altin-acik);
  position:relative;z-index:1;
}
h1 span{display:block}

/* ── Çağrı düğmesi ─────────────────────────────────────────────────────── */
/* Varsayılan hal CANLI: altın gradyan + Gece mürekkep, doğrudan Play'e.
   `onAccent` = Gece kilitli kararı burada da geçerli (en kötü kontrast 7.30).
   Script YALNIZCA iPhone/iPad istisnasını işler. */
.cta{
  display:inline-block;
  position:relative;z-index:1;
  margin:clamp(2.4rem,7vw,3.1rem) 0 0;
  padding:1.05rem 3rem;
  border-radius:999px;
  /* ⭑ Tip kararı: kelime markası TÖRENSEL serif (Cinzel), eylem ise DÜZ ve
     KARARLI bir geometrik sans (Jost 600). İkisi bilinçli olarak ayrı
     seslerdir — ad tören, düğme iş. Aynı yüz olsaydı düğme markanın bir
     parçası gibi okunur, bir EYLEM gibi değil. */
  font-family:"Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-weight:600;
  font-size:clamp(.84rem,3.2vw,.98rem);
  letter-spacing:.17em;
  text-indent:.17em;
  text-decoration:none;
  border:1px solid transparent;
  color:var(--gece);
  background-image:linear-gradient(135deg,#E7D4A6,#C6A35A);
  transition:background-image 180ms ease,border-color 180ms ease,color 180ms ease;
}
/* Dokunmatik cihaz dokunuşta sahte `:hover` üretir — kapı şart. */
@media (hover:hover) and (pointer:fine){
  .cta:hover{background-image:linear-gradient(135deg,#F0E2BE,#D2B26B)}
}
.cta:focus-visible{background-image:linear-gradient(135deg,#F0E2BE,#D2B26B)}
/* Bekleyen hal — bugün yalnız iPhone/iPad. Sessiz, çerçeveli, BAĞLANTISIZ. */
.cta--bekleyen{
  color:var(--sessiz);
  background-image:none;
  border-color:rgba(198,163,90,.28);
  cursor:default;
}

/* ── Alt şerit ─────────────────────────────────────────────────────────── */
/* TEK şerit, sayfanın dibinde: iletişim + iki hukuk bağlantısı + telif.
   Ayraç YOK, geniş aralık. Akış DIŞINDA ⇒ kompozisyonun yerini etkilemez.
   ⛔ Üst nav KALDIRILDI (Çağkan, 2 Eyl): "iletişim de aşağıda olsun".
      Sayfa tek ekran, aşağı yukarı inmek yok — bir üst şeride gerek yok.
   ⛔ "İletişim" bir sayfaya değil, DOĞRUDAN e-postaya gider (`mailto:`). */
footer{
  position:absolute;
  left:0;right:0;
  bottom:clamp(1.5rem,4vw,2.75rem);
  padding:0 1.25rem;
  font-size:.8125rem;
  letter-spacing:.04em;
  color:var(--sessiz);
  z-index:2;
}
footer ul{
  list-style:none;margin:0;padding:0;
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:.6rem clamp(1.5rem,7vw,4.5rem);
}
footer a{color:var(--sessiz);text-decoration:none;transition:color 180ms ease}
@media (hover:hover) and (pointer:fine){
  footer a:hover{color:var(--altin)}
}
footer a:focus-visible{color:var(--altin)}

/* Odak halkası — klavye kullanıcısı için görünür kalsın. */
a:focus-visible{outline:2px solid var(--altin);outline-offset:3px;border-radius:2px}
.cta:focus-visible{border-radius:999px;outline-offset:4px}

/* Kısa pencerede (yatay telefon) iki şerit de akışa döner; sütun yönü
   sayesinde üst-orta-alt sırasıyla dizilirler. */
@media (max-height:640px){
  footer{position:static;margin-top:clamp(2rem,6vw,3rem)}
}

/* ── Açılış sekansı ────────────────────────────────────────────────────── */
/* TEK orkestre edilmiş an: öğeler 70 ms arayla, 8 piksel yükselerek gelir.
   `both` dolgusu gecikme boyunca gizler; CSS hiç yüklenmezse kural da yok
   demektir ⇒ içerik yine görünür. */
.acil{animation:nd-yukselis 700ms var(--cikis) both}
.muhur  {animation-delay:0ms}
h1      {animation-delay:70ms}
.cta    {animation-delay:140ms}
footer  {animation-delay:210ms}
@keyframes nd-yukselis{
  from{opacity:0;transform:translateY(8px)}
  to  {opacity:1;transform:none}
}

/* ── Hareketi azalt ────────────────────────────────────────────────────── */
/* "Daha az ve daha yumuşak", SIFIR değil: bütün döngüler durur ama sistem
   EKRANDA KALIR — yörüngeler yatık hallerinde donar, noktalar kameraya
   dönük ve görünür kalır, nefes yalnız OPAKLIK olarak sürer. */
@media (prefers-reduced-motion:reduce){
  .yorunge{animation:none;transform:rotateZ(var(--z))}
  .donus  {animation:none;transform:rotateX(var(--egim))}
  .donus b{
    animation:none;
    transform:rotateY(calc(var(--a) * -1)) rotateX(calc(var(--egim) * -1));
    opacity:var(--o);
  }
  .acil{animation:none}
  .muhur::before{animation:nd-nefes-sakin 9s var(--nefes) infinite;transform:none}
  .cta,footer a{transition:none}
}
@keyframes nd-nefes-sakin{
  0%,100%{opacity:.5}
  50%    {opacity:.75}
}
</style>
