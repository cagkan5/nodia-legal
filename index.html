/* ════════════════════════════════════════════════════════════════════════
   NODIA COLLECTIVE — kök sayfa.  (LANDING-2 · 2 Eyl 2026)

   ⛔ BU SAYFA HUKUK METİNLERİNDEN AYRIDIR. `kullanim-sartlari/` rıza hash'i
      ailesindendir, `cocuk-guvenligi/` ise uygulamadaki güvenlik satırıyla
      kelimesi kelimesine bağlıdır — ikisine de bu dosyadan DOKUNULMAZ.

   ⛔ SAYFA HİÇBİR ŞEY ANLATMAZ. Bölüm yok, kaydırma yok, pazarlama metni
      yok, SLOGAN YOK (Çağkan, 2 Eyl). Görünen metin dört kelimeden ibarettir:
      marka adı ve düğme. Sayfanın tek işi bir insanın kapıyı çalmaya karar
      vermesi — o yüzden kapıyı TARİF ETMEZ, kapının KENDİSİ olur.

   ⛔ ŞEHİR ADI GEÇMEZ. Nodia bir şehirle sınırlı değildir. (Hukuk
      sayfalarındaki "Bursa" veri sorumlusunun POSTA ADRESİDİR, hizmet
      bölgesi değil — o ayrı bir şeydir ve oraya dokunulmaz.)

   ⛔ WEB SİTESİNDEN BAŞVURU YOK. Çağrı düğmesi bir forma değil, uygulamanın
      MAĞAZA adımına götürür. Hedefler `MAGAZA` bloğunda, sayfanın sonunda.

   ⭑ ZEMİN DEĞERLERİ UYDURULMADI — `brand/store/kaynak/B2-feature-graphic.svg`
      dosyasından, yani Play'de YAYINDA olan öne çıkan görselin kaynağından
      okundu: nokta dokusu BRONZ `#B36A3C` (altın değil), 26 px ızgara;
      halkalar ÜÇ tane, yarıçap oranı 200:300:400 ve opaklık .18/.11/.07,
      altın `#C6A35A`, 1.5 px; ışık merkezden değil mührün üstünden gelen
      sıcak bir radyal gradyan; kelime markası İKİ EŞİT satır, `#E7D4A6`,
      Cinzel, ~.3em aralık.
      ⛔ Opaklıklar bu ortama uyarlandı (1024×500 banner ile tam ekran sayfa
         aynı şey değil); RENKLER, ORANLAR ve YAPI birebir kaynaktandır.
      ⛔ ELENEN İKİ FİKİR, kayda geçsin: (a) "mühür kendi kendini çizsin" —
         enso'nun temiz vektörü YOK, feature graphic'te bile `<image>`;
         yapmak logoyu yeniden çizmek olurdu. (b) "NODIA büyük / COLLECTIVE
         küçük yazıt" — kaynak iki EŞİT satır gösteriyor; farklısı bir logo
         varyantı UYDURMAK olurdu.

   ⭑ İMZA ÖĞESİ — ORTA HALKA ÜZERİNDE DOKUZ BRONZ NOKTA. Sayfanın akılda
      kalan tek şeyi bu; geri kalan her şey sessiz. Noktalar SAYILABİLİR ve
      boyları EŞİT DEĞİL. Slogan silindiği için bu artık tek "söz": çember,
      kalabalık değil. Yazılmaz, çizilir. Çember bütün kompozisyonu çevreler
      ve dar ekranda taşar — ziyaretçi çemberi dışarıdan seyretmez, içinde
      durur.
      ⛔ Nokta markanın KENDİ doku öğesidir (kaynaktaki bronz nokta ızgarası);
         yeni bir biçim icat edilmedi, var olan öğe çembere dizildi.
      ⛔ İlk taslaktaki "kenarı bronz yaya boyanmış halka + tek nokta" ELENDİ:
         yavaş olsa da SPINNER görsel diline oturuyordu. Klişe hızda değil
         BİÇİMDE olur.

   ⭑ HAREKET SAF CSS — kütüphane yok. Önceden belirli hareket ana iş
      parçacığının dışında koşar; JS tabanlı animasyon sayfa yüklenirken kare
      düşürür. Ölçülen bedel de gereksizdi (Motion mini 5 KB / tam 46 KB).
      Üç hareket var, dördüncüsü yok: çemberin dönüşü (22 sn linear — K9'un
      değeri), mührün nefesi (7 sn, easeInOutSine) ve tek seferlik açılış
      sekansı. ⛔ Yalnız `transform` ve `opacity` animasyonlanır.

   ⭑ FONTLAR KENDİ SUNUCUMUZDA (varliklar/*.woff2), CDN'DEN DEĞİL. Google
      Fonts kullanmak her ziyaretçinin IP'sini üçüncü tarafa gönderirdi ve
      yayınlanmış Gizlilik Politikası web sitesi için böyle bir aktarım

      ⛔ Cormorant ARTIK YÜKLENMİYOR — tek kullanıcısı slogandı, o da silindi.
         Dosya `varliklar/` içinde DURUYOR (hukuk sayfaları onu kullanıyor).

   ⭑ DAİMA KOYU — bilinçli. Uygulamanın varsayılan teması 25 Ağu'da `system`
      yerine `dark`'a çekildi; gerekçe aynen burada da geçerli: Gece lansman
      rengidir ve markanın ilk izlenimi ziyaretçinin telefon ayarına
      DEVREDİLMEZ. (Hukuk sayfaları belge yüzeyidir; onlar iki temayı da

   ════════════════════════════════════════════════════════════════════════ */

@font-face{font-family:"Cinzel";src:url("varliklar/cinzel-500.woff2") format("woff2");
  font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Jost";src:url("varliklar/jost-400.woff2") format("woff2");
  font-weight:400;font-style:normal;font-display:swap}

:root{
  --gece:#1E1913;
  --altin:#C6A35A;
  --altin-acik:#E7D4A6; /* kaynaktaki kelime markası rengi */
  --bronz:#B36A3C;
  --kum:#E5D8C0;
  --sessiz:#9A9285;

  /* Eğriler — tarayıcının zayıf yerleşiklerinden DEĞİL, adı olan
     eğrilerden. `--cikis` güçlü ease-out (giriş); `--nefes` easeInOutSine,
     7 saniyelik bir nefes için doğru olan (arayüz için kalibre edilmiş sert
     ease-in-out burada mekanik durur). */
  --cikis:cubic-bezier(0.23,1,0.32,1);
  --nefes:cubic-bezier(0.37,0,0.63,1);

  /* Orta halkanın yarıçapı. Diğer ikisi kaynaktaki 200:300:400 oranından
     türetilir ⇒ ×2/3 ve ×4/3. */
  --r:min(43vw,296px);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(2rem,8vw,4rem) 1.25rem;
  background-color:var(--gece);
  color:var(--kum);
  font-family:"Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:1.0625rem;
  line-height:1.7;
  text-align:center;
  overflow-x:hidden;
  /* Kaynaktaki iki zemin katmanı: sıcak radyal ışık + BRONZ nokta ızgarası
     (26 px). Işık kaynakta mührün üstündedir; mühür burada ortada olduğu
     için ışık da ortada. */
  background-image:
    radial-gradient(circle at 50% 46%,
      rgba(198,163,90,.13) 0%,
      rgba(179,106,60,.06) 38%,
      rgba(30,25,19,0) 72%),
    radial-gradient(rgba(179,106,60,.14) 1.3px,transparent 1.3px);
  background-size:100% 100%,26px 26px;
  background-position:center,center;
}

/* ── Zemin çemberleri ──────────────────────────────────────────────────── */
/* Kaynaktaki üç eşmerkezli halka. Dekoratif, ekran okuyucudan gizli. */
/* ⚠️ `grid-template:100%/100%` ŞART. Onsuz ızgara satırı EN BÜYÜK çocuğa
   (dış halka) göre büyür ve ortalama o satırın içinde yapılır ⇒ bütün
   çember sistemi pencere merkezinden kayar (ölçüldü: 720px yükseklikte
   35px aşağıda) ve kayma miktarı pencere boyuna göre değişir. Sabit iz
   pencereyi kilitler; taşan halkayı `overflow` kırpar. */
.zemin{position:fixed;inset:0;pointer-events:none;display:grid;grid-template:100%/100%;place-items:center;overflow:hidden}
.zemin > *{grid-area:1/1;border-radius:50%}
/* ⚠️ `border-color`u BURADA verme — `.zemin span` (0,1,1) aşağıdaki tek
   sınıf seçicilerinden (0,1,0) daha özgül olduğu için rengi ezer ve üç
   halka da GÖRÜNMEZ olur. Bir kez oldu, ölçümle yakalandı. */
.zemin span{aspect-ratio:1;border-style:solid;border-width:1.5px}
.halka-ic  {width:calc(var(--r) * 4/3);border-color:rgba(198,163,90,.18)}
.halka-orta{width:calc(var(--r) * 2);  border-color:rgba(198,163,90,.11)}
.halka-dis {width:calc(var(--r) * 8/3);border-color:rgba(198,163,90,.07)}

/* ── İmza: orta halka üzerinde dokuz bronz nokta ───────────────────────── */
/* Tek animasyonlu öğe KAPSAYICIDIR; dokuz nokta durağan `transform`la
   yerleştirilir ve dönüşü ondan miras alır ⇒ kare başına tek birleştirme.
   ⛔ Noktalar EŞİT DEĞİL — boy ve opaklık kasıtlı olarak değişir.
      Bireysellik ikinci bir animasyonla değil durağan çeşitlemeyle verilir;
      ikinci bir döngü mührün nefesiyle yarışırdı. */
.cember{
  width:calc(var(--r) * 2);aspect-ratio:1;
  position:relative;
  animation:nd-donus 22s linear infinite;
}
.cember i{position:absolute;top:50%;left:50%;border-radius:50%;background:var(--bronz)}
/* 40°'lik dilimler; yarıçap `--r`den ⇒ ölçek her ekranda korunur. */
.cember i:nth-child(1){width:7px;height:7px;margin:-3.5px 0 0 -3.5px;opacity:.80;transform:rotate(0deg)   translateY(calc(var(--r) * -1))}
.cember i:nth-child(2){width:5px;height:5px;margin:-2.5px 0 0 -2.5px;opacity:.50;transform:rotate(40deg)  translateY(calc(var(--r) * -1))}
.cember i:nth-child(3){width:8px;height:8px;margin:-4px 0 0 -4px;    opacity:.92;transform:rotate(80deg)  translateY(calc(var(--r) * -1));box-shadow:0 0 10px 1px rgba(179,106,60,.45)}
.cember i:nth-child(4){width:4px;height:4px;margin:-2px 0 0 -2px;    opacity:.42;transform:rotate(120deg) translateY(calc(var(--r) * -1))}
.cember i:nth-child(5){width:6px;height:6px;margin:-3px 0 0 -3px;    opacity:.68;transform:rotate(160deg) translateY(calc(var(--r) * -1))}
.cember i:nth-child(6){width:5px;height:5px;margin:-2.5px 0 0 -2.5px;opacity:.55;transform:rotate(200deg) translateY(calc(var(--r) * -1))}
.cember i:nth-child(7){width:7px;height:7px;margin:-3.5px 0 0 -3.5px;opacity:.75;transform:rotate(240deg) translateY(calc(var(--r) * -1))}
.cember i:nth-child(8){width:4px;height:4px;margin:-2px 0 0 -2px;    opacity:.40;transform:rotate(280deg) translateY(calc(var(--r) * -1))}
.cember i:nth-child(9){width:6px;height:6px;margin:-3px 0 0 -3px;    opacity:.62;transform:rotate(320deg) translateY(calc(var(--r) * -1))}
@keyframes nd-donus{ to{transform:rotate(360deg)} }

main{position:relative;max-width:34rem;width:100%}

/* ── Mühür ─────────────────────────────────────────────────────────────── */
.muhur{
  position:relative;
  display:grid;place-items:center;
  margin:0 auto clamp(1.6rem,4.5vw,2.2rem);
}
.muhur img{
  display:block;
  width:clamp(108px,27vw,152px);height:auto;
  position:relative;z-index:1;
}
/* Nefes — mührün KENDİSİ değil, arkasındaki parıltı nefes alır: marka
   çizimi sabit kalır, hareket yalnız ışıkta olur. (K9'un değerleri.) */
.muhur::before{
  content:"";position:absolute;
  width:clamp(154px,39vw,220px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(198,163,90,.20) 0%,rgba(198,163,90,0) 68%);
  animation:nd-nefes 7s var(--nefes) infinite;
}
@keyframes nd-nefes{
  0%,100%{opacity:.45;transform:scale(1)}
  50%    {opacity:.90;transform:scale(1.06)}
}

/* ── Kelime markası ────────────────────────────────────────────────────── */
/* ⚠️ TÜRKÇE İ TUZAĞI — `text-transform:uppercase` KULLANILMAZ. Sayfa
   `lang="tr"` olduğu için tarayıcı "Nodia" → "NODİA" üretir (noktalı İ) ve
   marka adı bozulur. Bu yüzden büyük harfler DOĞRUDAN yazılmıştır.
   Aynı tuzak uygulamada da yaşandı (SEKME-IKON-1).
   ⛔ İki satır EŞİT puntoda — kaynaktaki kelime markası böyledir. */
h1{
  margin:0;
  font-family:"Cinzel",Georgia,"Times New Roman",serif;
  font-weight:500;
  font-size:clamp(1.35rem,5.6vw,2rem);
  line-height:1.45;
  letter-spacing:.3em;
  text-indent:.3em; /* sondaki harf boşluğunu geri al — optik ortalama */
  color:var(--altin-acik);
}
h1 span{display:block}

/* ── Çağrı düğmesi ─────────────────────────────────────────────────────── */
/* İKİ HAL, tek öğe:
     · pasif (varsayılan, HTML'de basılı) — uygulama o platformda henüz
       yayında değil. Çerçeveli, sessiz, BAĞLANTISIZ. Ölü link üretmez.
     · canlı (script `href` verince) — altın gradyan + Gece mürekkep.
       Gradyan uygulamanın birincil düğmesinin aynısı; `onAccent` = Gece
       kilitli kararı burada da geçerli (ölçülen en kötü kontrast 7.30). */
.cta{
  display:inline-block;
  margin:clamp(2.4rem,7vw,3.1rem) 0 0;
  padding:1rem 2.9rem;
  border-radius:999px;
  font-size:.9375rem;
  letter-spacing:.12em;
  text-decoration:none;
  border:1px solid rgba(198,163,90,.3);
  color:var(--kum);
  background-color:transparent;
  transition:border-color 180ms ease,color 180ms ease,background-color 180ms ease;
}
.cta--canli{
  border-color:transparent;
  color:var(--gece);
  background-image:linear-gradient(135deg,#E7D4A6,#C6A35A);
  font-weight:500;
}
/* Dokunmatik cihaz dokunuşta sahte `:hover` üretir — kapı şart. */
@media (hover:hover) and (pointer:fine){
  .cta--canli:hover{background-image:linear-gradient(135deg,#F0E2BE,#D2B26B)}
}
.cta--canli:focus-visible{background-image:linear-gradient(135deg,#F0E2BE,#D2B26B)}

/* ── Hukuk şeridi ──────────────────────────────────────────────────────── */
/* Üst nav YOK — bağlantıların tamamı burada, iki kademede. Beşi de
   erişilebilir kalır: mağaza politikaları bunları bekliyor, sadelik
   uğruna hiçbiri kaldırılmaz. */
footer{
  margin-top:clamp(3rem,9vw,4.5rem);
  padding-top:clamp(1.35rem,4vw,1.75rem);
  border-top:1px solid rgba(198,163,90,.1);
  font-size:.8125rem;line-height:1.9;color:var(--sessiz);
}
footer ul{
  list-style:none;margin:0;padding:0;
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:0 .95rem;
}
footer li{position:relative}
/* ⚠️ Ayraç ÖNCEKİ öğenin SONUNA konur, sonrakinin başına değil. `::before`
   ile yazılırsa satır kaydığında nokta yeni satırın BAŞINDA tek başına
   kalır ("· Gizlilik Politikası") — 375 px'de ölçüldü. Sonda kalan nokta
   ise satırın devam ettiğini söyler, kusur gibi durmaz. */
footer li:not(:last-child)::after{
  content:"·";position:absolute;right:-.58rem;
  color:rgba(154,146,133,.45);
}
footer .ikincil{margin-top:.3rem;font-size:.75rem;opacity:.82}
footer a{
  color:var(--kum);
  text-decoration:none;
  border-bottom:1px solid rgba(229,216,192,.18);
  padding-bottom:1px;
}
footer .ikincil a{color:var(--sessiz);border-bottom-color:rgba(154,146,133,.22)}
footer a:hover,footer a:focus-visible{
  color:var(--altin);border-bottom-color:rgba(198,163,90,.7);
}

/* Odak halkası — klavye kullanıcısı için görünür kalsın. */
a:focus-visible{outline:2px solid var(--altin);outline-offset:3px;border-radius:2px}
.cta:focus-visible{border-radius:999px;outline-offset:4px}

/* ── Açılış sekansı ────────────────────────────────────────────────────── */
/* Dağınık efekt yerine TEK orkestre edilmiş an: öğeler 70 ms arayla,
   8 piksel yükselerek gelir. `scale(0)` yok — hiçbir şey yoktan belirmez.
   `both` dolgusu sayesinde gecikme boyunca görünmezler; CSS hiç yüklenmezse
   kural da yok demektir ⇒ içerik yine görünür. */
.acil{animation:nd-yukselis 700ms var(--cikis) both}
.muhur {animation-delay:0ms}
h1     {animation-delay:70ms}
.cta   {animation-delay:140ms}
footer {animation-delay:210ms}
@keyframes nd-yukselis{
  from{opacity:0;transform:translateY(8px)}
  to  {opacity:1;transform:none}
}

/* ── Hareketi azalt ────────────────────────────────────────────────────── */
/* "Daha az ve daha yumuşak", SIFIR değil: konum/ölçek değişimlerinin hepsi
   kalkar, nefes yalnız OPAKLIK olarak sürer, çember durur ama DOM'da ve
   ekranda KALIR — kompozisyon bozulmaz. Açılış sekansı tamamen iptal edilir;
   `animation:none` dolguyu da kaldırdığı için öğeler doğal (görünür)
   hallerinde durur. */
@media (prefers-reduced-motion:reduce){
  .cember{animation:none}
  .acil{animation:none}
  .muhur::before{animation:nd-nefes-sakin 9s var(--nefes) infinite;transform:none}
  .cta{transition:none}
}
@keyframes nd-nefes-sakin{
  0%,100%{opacity:.5}
  50%    {opacity:.75}
}

/* Çok dar ekranda şerit alt alta rahat nefes alsın. */
@media (max-width:22rem){
  footer ul{gap:0}
  footer li{flex:0 0 100%}
  footer li + li::before{display:none}
}
</style>
</head>

<main>
  <div class="muhur acil">

  </div>

  <h1 class="acil"><span>NODIA</span><span>COLLECTIVE</span></h1>

  <!-- ⛔ `href` YOK ve bu bilinçli: uygulama henüz hiçbir mağazada yayında

       çevirir. JavaScript çalışmazsa düğme bu haliyle kalır — sayfa yine

<script>
/* ════════════════════════════════════════════════════════════════════════
   MAĞAZA HEDEFLERİ — TEK KAYNAK. Üretim günü burada tek satır değişir.

   ⛔ `null` = uygulama o platformda HENÜZ YAYINDA DEĞİL ⇒ düğme "Yakında"
      halinde kalır ve hiçbir yere bağlanmaz.
   ⚠️ Android linki ancak Play'de ÜRETİM yayını başladıktan sonra
      doldurulmalı: kapalı testte liste sayfası herkese 404 döner
      [ÖLÇÜM · 2 Eyl 2026: HTTP 404; pozitif kontrol Spotify aynı yoldan 200].
   ⚠️ iOS uygulaması bugün YOK [ÖLÇÜM: App Store bundle sorgusu 0 sonuç].

   ⛔ Bu sayfanın TEK JavaScript'i. Kütüphane yok, dış istek yok, çerez ve
      depolama yok; `navigator.userAgent` yalnız okunur, hiçbir yere
      gönderilmez ⇒ "sıfır üçüncü taraf" kuralı ve Gizlilik Politikası
      olduğu gibi korunur.
   ════════════════════════════════════════════════════════════════════════ */
(function () {
  var MAGAZA = {
    android: null, // üretime çıkınca: "https://play.google.com/store/apps/details?id=com.nodiacollective.app"
    ios:     null  // App Store yayınlanınca doldurulur
  };

  var dugme = document.getElementById('cta');
  if (!dugme) return;

  var ua = navigator.userAgent || '';
  // iPadOS 13+ kendini "Macintosh" diye tanıtır; dokunma noktası sayısı ayırt eder.
  var iOS = /iPad|iPhone|iPod/.test(ua) ||
            (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/.test(ua);

  // Masaüstünde platform yok: dolu olan hangisiyse o. İkisi de doluysa
  // Android öncelikli (bugün tek yayın hattı odur).
  var hedef = iOS ? MAGAZA.ios
            : android ? MAGAZA.android
            : (MAGAZA.android || MAGAZA.ios);

  if (!hedef) return; // yayında değil ⇒ "Yakında" hali korunur

  dugme.setAttribute('href', hedef);
  dugme.setAttribute('rel', 'noopener');
  dugme.removeAttribute('aria-disabled');
  dugme.classList.add('cta--canli');
  dugme.textContent = 'Başvur';
})();
</script>

</body>
