/* ════════════════════════════════════════════════════════════════════════
   NODIA COLLECTIVE — kök sayfa.  (LANDING-2 · 2 Eyl 2026)

   ⛔ BU SAYFA HUKUK METİNLERİNDEN AYRIDIR. `kullanim-sartlari/` rıza hash'i
      ailesindendir, `cocuk-guvenligi/` ise uygulamadaki güvenlik satırıyla
      kelimesi kelimesine bağlıdır — ikisine de bu dosyadan DOKUNULMAZ.

   ⛔ SAYFA HİÇBİR ŞEY ANLATMAZ. Bölüm yok, kaydırma yok, pazarlama metni
      yok, SLOGAN YOK. Görünen metin marka adı, düğme ve üç bağlantıdan
      ibarettir. Sayfanın tek işi bir insanın kapıyı çalmaya karar vermesi —
      o yüzden kapıyı TARİF ETMEZ, kapının KENDİSİ olur.

   ⛔ ŞEHİR ADI GEÇMEZ. Nodia bir şehirle sınırlı değildir. (Hukuk
      sayfalarındaki "Bursa" veri sorumlusunun POSTA ADRESİDİR, hizmet
      bölgesi değil — o ayrı bir şeydir ve oraya dokunulmaz.)

   ⛔ WEB SİTESİNDEN BAŞVURU YOK. Düğme bir forma değil, uygulamanın MAĞAZA
      adımına götürür.

   ⭑ ZEMİN DEĞERLERİ UYDURULMADI — `brand/store/kaynak/B2-feature-graphic.svg`
      dosyasından, yani Play'de YAYINDA olan öne çıkan görselin kaynağından
      okundu: nokta dokusu BRONZ `#B36A3C` (altın değil), 26 px ızgara;
      halkalar ÜÇ tane, yarıçap oranı 200:300:400 ve opaklık .18/.11/.07,
      altın `#C6A35A`, 1.5 px; kelime markası İKİ EŞİT satır, `#E7D4A6`,
      Cinzel, ~.3em aralık.
      ⛔ Opaklıklar bu ortama uyarlandı (1024×500 banner ile tam ekran sayfa
         aynı şey değil); RENKLER, ORANLAR ve YAPI birebir kaynaktandır.
      ⛔ ELENEN İKİ FİKİR: (a) "mühür kendi kendini çizsin" — enso'nun temiz
         vektörü YOK, feature graphic'te bile `<image>`; yapmak logoyu
         yeniden çizmek olurdu. (b) "NODIA büyük / COLLECTIVE küçük yazıt" —
         kaynak iki EŞİT satır gösteriyor, farklısı logo varyantı uydurmaktı.

   ⭑ İMZA ÖĞESİ — ÜÇ YÖRÜNGE, YİRMİ YEDİ NOKTA. Her halkanın kendi noktaları
      var ve her biri KENDİ hızında döner (16 / 22 / 34 sn) ⇒ halkalar
      birbirine göre yavaşça kayar, hiçbir an tekrarlanmaz. Ortadaki 22 sn
      uygulamanın K9 ekranının değeridir.
      ⭑ Adet yarıçapla ORANTILI (6 / 9 / 12) ⇒ noktalar arası YAY aralığı üç
        halkada da aynı; sayı keyfi değil, geometriden geliyor.
      ⭑ Noktalar büyüyüp küçülür; her birinin süresi ve faz gecikmesi ayrı
        (altın oran adımıyla dağıtıldı) ⇒ hiçbir ikisi aynı anda nabız atmaz.
      ⭑ Dış halkanın noktaları daha küçük ve soluk — derinlik.
      ⛔ Nokta markanın KENDİ doku öğesidir (kaynaktaki bronz nokta ızgarası);
         yeni bir biçim icat edilmedi, var olan öğe yörüngeye dizildi.
      ⛔ ELENDİ: "kenarı bronz yaya boyanmış halka + tek nokta" — yavaş olsa
         da SPINNER görsel diline oturuyordu. Klişe hızda değil BİÇİMDE olur.

   ⭑ HAREKET SAF CSS — kütüphane yok. Önceden belirli hareket ana iş
      parçacığının dışında koşar; JS tabanlı animasyon sayfa yüklenirken kare
      düşürür. Ölçülen bedel de gereksizdi (Motion mini 5 KB / tam 46 KB).
      ⛔ Yalnız `transform` ve `opacity` animasyonlanır.
      ⛔ Dönüş ile nabız AYRI ÖĞELERDE: `<i>` konumu taşır (durağan
         `rotate+translate`), `<b>` nabzı (`scale`). Tek öğede birleştirilse
         her nabız karesinde açı da yeniden hesaplanırdı.

   ⭑ FONTLAR KENDİ SUNUCUMUZDA (varliklar/*.woff2), CDN'DEN DEĞİL. Google
      Fonts kullanmak her ziyaretçinin IP'sini üçüncü tarafa gönderirdi ve
      yayınlanmış Gizlilik Politikası web sitesi için böyle bir aktarım
      BEYAN ETMİYOR — sayfa ile metni çelişirdi. Lisans:
      varliklar/FONT-LISANSLARI.txt (SIL OFL 1.1).
      ⛔ Cormorant ARTIK YÜKLENMİYOR — tek kullanıcısı slogandı, o da silindi.
         Dosya `varliklar/` içinde DURUYOR (hukuk sayfaları kullanıyor).

   ⭑ ALT ŞERİT ÜÇ ÖĞEYE İNDİ (Çağkan, 2 Eyl: "sade olsun, Raya gibi").
      Kaldırılan üç bağlantının erişilebilirliği ÖLÇÜLDÜ, körü körüne
      silinmedi: `cocuk-guvenligi` BEŞ hukuk sayfasından, `aydinlatma` yine
      beşinden, `hesap-silme` ise `aydinlatma`'dan linkli ⇒ üçü de ayakta
      ve zincirle erişilebilir kalıyor. Sayfaların KENDİLERİ silinmedi.

   ⭑ DAİMA KOYU — bilinçli. Uygulamanın varsayılan teması 25 Ağu'da `system`
      yerine `dark`'a çekildi; gerekçe aynen burada da geçerli: Gece lansman
      rengidir ve markanın ilk izlenimi ziyaretçinin telefon ayarına
      DEVREDİLMEZ. (Hukuk sayfaları belge yüzeyidir; onlar iki temayı da
      destekler.)
   ════════════════════════════════════════════════════════════════════════ */

@font-face{font-family:"Cinzel";src:url("varliklar/cinzel-500.woff2") format("woff2");
  font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Jost";src:url("varliklar/jost-400.woff2") format("woff2");
  font-weight:400;font-style:normal;font-display:swap}

:root{
  --gece:#1E1913;
  --altin:#C6A35A;
  --altin-acik:#E7D4A6; /* kaynaktaki kelime markası rengi */
  --bronz:#B36A3C;
  --kum:#E5D8C0;
  --sessiz:#9A9285;

  /* Eğriler — tarayıcının zayıf yerleşiklerinden DEĞİL, adı olan
     eğrilerden. `--cikis` güçlü ease-out (giriş); `--nefes` easeInOutSine,
     uzun ambiyans döngüleri için doğru olan (arayüz için kalibre edilmiş
     sert ease-in-out burada mekanik durur). */
  --cikis:cubic-bezier(0.23,1,0.32,1);
  --nefes:cubic-bezier(0.37,0,0.63,1);

  /* Orta halkanın yarıçapı. Diğer ikisi kaynaktaki 200:300:400 oranından
     türetilir ⇒ ×2/3 ve ×4/3. */
  --r:min(43vw,296px);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  position:relative;
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(2rem,8vw,4rem) 1.25rem;
  background-color:var(--gece);
  color:var(--kum);
  font-family:"Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:1.0625rem;
  line-height:1.7;
  text-align:center;
  overflow-x:hidden;
  /* Kaynaktaki iki zemin katmanı: sıcak radyal ışık + BRONZ nokta ızgarası
     (26 px). */
  background-image:
    radial-gradient(circle at 50% 46%,
      rgba(198,163,90,.13) 0%,
      rgba(179,106,60,.06) 38%,
      rgba(30,25,19,0) 72%),
    radial-gradient(rgba(179,106,60,.14) 1.3px,transparent 1.3px);
  background-size:100% 100%,26px 26px;
  background-position:center,center;
}

/* ── Zemin: üç halka + üç yörünge ──────────────────────────────────────── */
/* ⚠️ `grid-template:100%/100%` ŞART. Onsuz ızgara satırı EN BÜYÜK çocuğa
   göre büyür ve ortalama o satırın içinde yapılır ⇒ bütün çember sistemi
   pencere merkezinden kayar (ölçüldü: 720px yükseklikte 35px aşağıda) ve
   kayma miktarı pencere boyuna göre değişir. */
.zemin{position:fixed;inset:0;pointer-events:none;display:grid;grid-template:100%/100%;place-items:center;overflow:hidden}
.zemin > *{grid-area:1/1;border-radius:50%;aspect-ratio:1}

/* ⚠️ `border-color`u BURADA verme — `.zemin span` (0,1,1) aşağıdaki tek
   sınıf seçicilerinden (0,1,0) daha özgül olduğu için rengi ezer ve üç
   halka da GÖRÜNMEZ olur. Bir kez oldu, ölçümle yakalandı. */
.zemin span{border-style:solid;border-width:1.5px}
.iz-ic  {width:calc(var(--r) * 4/3);border-color:rgba(198,163,90,.18)}
.iz-orta{width:calc(var(--r) * 2);  border-color:rgba(198,163,90,.11)}
.iz-dis {width:calc(var(--r) * 8/3);border-color:rgba(198,163,90,.07)}

/* Yörüngeler: her biri kendi hızında. Tek animasyonlu öğe KAPSAYICIDIR;
   noktalar durağan `transform`la yerleşir ve dönüşü ondan miras alır. */
.yorunge{position:relative;animation:nd-donus linear infinite}
.yr-ic  {--rr:calc(var(--r) * 2/3);width:calc(var(--r) * 4/3);animation-duration:16s}
.yr-orta{--rr:var(--r);            width:calc(var(--r) * 2);  animation-duration:22s}
.yr-dis {--rr:calc(var(--r) * 4/3);width:calc(var(--r) * 8/3);animation-duration:34s}
@keyframes nd-donus{ to{transform:rotate(360deg)} }

/* `<i>` yalnız KONUM taşır (boyutsuz nokta), `<b>` görünen daireyi ve
   NABZI taşır. Böylece iki hareket birbirinin hesabını bozmaz. */
.yorunge i{
  position:absolute;top:50%;left:50%;width:0;height:0;
  transform:rotate(var(--a)) translateY(calc(var(--rr) * -1));
}
.yorunge b{
  position:absolute;top:0;left:0;
  width:var(--b);height:var(--b);
  margin:calc(var(--b) / -2) 0 0 calc(var(--b) / -2);
  border-radius:50%;
  background:var(--bronz);
  opacity:var(--o);
  animation:nd-nabiz var(--s) var(--nefes) var(--d) infinite;
}
/* `scale(0)` YOK — hiçbir şey yoktan belirmez. */
@keyframes nd-nabiz{
  0%,100%{transform:scale(.72)}
  50%    {transform:scale(1.18)}
}
/* En içteki halkanın en parlak noktası hafifçe ışır — derinlik, "baş" değil. */
.yr-ic i:nth-child(2) b{box-shadow:0 0 10px 1px rgba(179,106,60,.45)}

main{position:relative;max-width:34rem;width:100%}

/* ── Mühür ─────────────────────────────────────────────────────────────── */
.muhur{
  position:relative;
  display:grid;place-items:center;
  margin:0 auto clamp(1.6rem,4.5vw,2.2rem);
}
.muhur img{
  display:block;
  width:clamp(108px,27vw,152px);height:auto;
  position:relative;z-index:1;
}
/* Nefes — mührün KENDİSİ değil, arkasındaki parıltı nefes alır: marka
   çizimi sabit kalır, hareket yalnız ışıkta olur. (K9'un değerleri.) */
.muhur::before{
  content:"";position:absolute;
  width:clamp(154px,39vw,220px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(198,163,90,.20) 0%,rgba(198,163,90,0) 68%);
  animation:nd-nefes 7s var(--nefes) infinite;
}
@keyframes nd-nefes{
  0%,100%{opacity:.45;transform:scale(1)}
  50%    {opacity:.90;transform:scale(1.06)}
}

/* ── Kelime markası ────────────────────────────────────────────────────── */
/* ⚠️ TÜRKÇE İ TUZAĞI — `text-transform:uppercase` KULLANILMAZ. Sayfa
   `lang="tr"` olduğu için tarayıcı "Nodia" → "NODİA" üretir (noktalı İ) ve
   marka adı bozulur. Bu yüzden büyük harfler DOĞRUDAN yazılmıştır.
   ⛔ İki satır EŞİT puntoda — kaynaktaki kelime markası böyledir. */
h1{
  margin:0;
  font-family:"Cinzel",Georgia,"Times New Roman",serif;
  font-weight:500;
  font-size:clamp(1.35rem,5.6vw,2rem);
  line-height:1.45;
  letter-spacing:.3em;
  text-indent:.3em; /* sondaki harf boşluğunu geri al — optik ortalama */
  color:var(--altin-acik);
}
h1 span{display:block}

/* ── Çağrı düğmesi ─────────────────────────────────────────────────────── */
/* Varsayılan hal CANLI: altın gradyan + Gece mürekkep, doğrudan Play'e.
   Gradyan uygulamanın birincil düğmesinin aynısı; `onAccent` = Gece kilitli
   kararı burada da geçerli (ölçülen en kötü kontrast 7.30).
   Script YALNIZCA iPhone/iPad istisnasını işler (aşağıya bakın). */
.cta{
  display:inline-block;
  margin:clamp(2.4rem,7vw,3.1rem) 0 0;
  padding:1rem 3.1rem;
  border-radius:999px;
  font-size:.9375rem;
  font-weight:500;
  letter-spacing:.12em;
  text-decoration:none;
  border:1px solid transparent;
  color:var(--gece);
  background-image:linear-gradient(135deg,#E7D4A6,#C6A35A);
  transition:background-image 180ms ease,border-color 180ms ease,color 180ms ease;
}
/* Dokunmatik cihaz dokunuşta sahte `:hover` üretir — kapı şart. */
@media (hover:hover) and (pointer:fine){
  .cta:hover{background-image:linear-gradient(135deg,#F0E2BE,#D2B26B)}
}
.cta:focus-visible{background-image:linear-gradient(135deg,#F0E2BE,#D2B26B)}
/* Bekleyen hal — bugün yalnız iPhone/iPad. Sessiz, çerçeveli, BAĞLANTISIZ. */
.cta--bekleyen{
  color:var(--sessiz);
  background-image:none;
  border-color:rgba(198,163,90,.28);
  font-weight:400;
  cursor:default;
}

/* ── Alt şerit ─────────────────────────────────────────────────────────── */
/* Üç öğe, ayraç YOK, geniş aralık — Raya'nın ritmi. Sayfanın dibine
   sabitlenir ki kompozisyon pencerenin tam ortasında kalsın (zemin
   halkaları da orada merkezli). */
footer{
  position:absolute;
  left:0;right:0;
  bottom:clamp(1.5rem,4vw,2.75rem);
  padding:0 1.25rem;
  font-size:.8125rem;
  letter-spacing:.04em;
  color:var(--sessiz);
}
footer ul{
  list-style:none;margin:0;padding:0;
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:.6rem clamp(1.5rem,7vw,4.5rem);
}
footer a{
  color:var(--sessiz);
  text-decoration:none;
  transition:color 180ms ease;
}
@media (hover:hover) and (pointer:fine){
  footer a:hover{color:var(--altin)}
}
footer a:focus-visible{color:var(--altin)}

/* Odak halkası — klavye kullanıcısı için görünür kalsın. */
a:focus-visible{outline:2px solid var(--altin);outline-offset:3px;border-radius:2px}
.cta:focus-visible{border-radius:999px;outline-offset:4px}

/* Kısa pencerede (yatay telefon) şerit akışa döner ki kompozisyonla
   çakışmasın. */
@media (max-height:640px){
  footer{position:static;margin-top:clamp(2rem,6vw,3rem)}
}

/* ── Açılış sekansı ────────────────────────────────────────────────────── */
/* Dağınık efekt yerine TEK orkestre edilmiş an: öğeler 70 ms arayla,
   8 piksel yükselerek gelir. `both` dolgusu sayesinde gecikme boyunca
   görünmezler; CSS hiç yüklenmezse kural da yok demektir ⇒ içerik yine
   görünür. */
.acil{animation:nd-yukselis 700ms var(--cikis) both}
.muhur {animation-delay:0ms}
h1     {animation-delay:70ms}
.cta   {animation-delay:140ms}
footer {animation-delay:210ms}
@keyframes nd-yukselis{
  from{opacity:0;transform:translateY(8px)}
  to  {opacity:1;transform:none}
}

/* ── Hareketi azalt ────────────────────────────────────────────────────── */
/* "Daha az ve daha yumuşak", SIFIR değil: konum/ölçek değişimlerinin hepsi
   kalkar, nefes yalnız OPAKLIK olarak sürer, üç yörünge de durur ama DOM'da
   ve ekranda KALIR — kompozisyon bozulmaz. Açılış sekansı iptal edilir;
   `animation:none` dolguyu da kaldırdığı için öğeler doğal (görünür)
   hallerinde durur. */
@media (prefers-reduced-motion:reduce){
  .yorunge{animation:none}
  .yorunge b{animation:none}
  .acil{animation:none}
  .muhur::before{animation:nd-nefes-sakin 9s var(--nefes) infinite;transform:none}
  .cta{transition:none}
  footer a{transition:none}
}
@keyframes nd-nefes-sakin{
  0%,100%{opacity:.5}
  50%    {opacity:.75}
}
</style>
</head>
<body>

<div class="zemin" aria-hidden="true">
  <span class="iz-ic"></span>
  <span class="iz-orta"></span>
  <span class="iz-dis"></span>

  <div class="yorunge yr-ic">
    <i style="--a:0deg;--b:5px;--o:0.67;--s:6.8s;--d:-0s"><b></b></i><i style="--a:60deg;--b:6.9px;--o:0.92;--s:5.8s;--d:-3.6s"><b></b></i><i style="--a:120deg;--b:5.7px;--o:0.76;--s:7.5s;--d:-1.8s"><b></b></i>
    <i style="--a:180deg;--b:7.6px;--o:0.61;--s:6.4s;--d:-5.5s"><b></b></i><i style="--a:240deg;--b:6.4px;--o:0.86;--s:5.4s;--d:-2.5s"><b></b></i><i style="--a:300deg;--b:5.3px;--o:0.7;--s:7.1s;--d:-0.6s"><b></b></i>
  </div>

  <!-- orta: 9 nokta -->
  <div class="yorunge yr-orta">
    <i style="--a:0deg;--b:4px;--o:0.58;--s:7.4s;--d:-0s"><b></b></i><i style="--a:40deg;--b:6.5px;--o:0.89;--s:6.2s;--d:-3.8s"><b></b></i><i style="--a:80deg;--b:4.9px;--o:0.7;--s:8.1s;--d:-1.9s"><b></b></i>
    <i style="--a:120deg;--b:7.4px;--o:0.51;--s:7s;--d:-6s"><b></b></i><i style="--a:160deg;--b:5.9px;--o:0.82;--s:5.8s;--d:-2.7s"><b></b></i><i style="--a:200deg;--b:4.4px;--o:0.63;--s:7.7s;--d:-0.7s"><b></b></i>
    <i style="--a:240deg;--b:6.8px;--o:0.44;--s:6.5s;--d:-4.6s"><b></b></i><i style="--a:280deg;--b:5.3px;--o:0.75;--s:5.4s;--d:-1.8s"><b></b></i><i style="--a:320deg;--b:7.8px;--o:0.56;--s:7.2s;--d:-6.8s"><b></b></i>
  </div>

  <!-- dış: 12 nokta, daha küçük ve soluk (derinlik) -->
  <div class="yorunge yr-dis">
